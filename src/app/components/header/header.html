<header class="gp-header">
  <div class="header-top">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">GP</span>
      <div>
        <h1>Banana <em>GP</em></h1>
        <p>THE MATH GRAND PRIX</p>
      </div>
    </div>
    <div class="account">
      <span>{{ name() }}</span
      ><button
        class="secondary-button"
        (click)="onReset()"
        [disabled]="gameState.saving() || gameState.isLoadingScore() || !!gameState.error()"
      >
        Reset score</button
      ><button class="secondary-button" (click)="onLogout()" [disabled]="gameState.saving()">
        Sign out
      </button>
    </div>
  </div>
  <div class="stats-bar">
    <span>YOUR TELEMETRY</span>
    <div>
      <b>{{ gameState.score() }}</b> POINTS
    </div>
    <div>
      <b>{{ gameState.highScore() }}</b> BEST
    </div>
    <div>
      <b>{{ gameState.correctAnswers() }}</b> BOOSTS
    </div>
    <div>
      <b>{{ gameState.wrongAnswers() }}</b> SLOWDOWNS
    </div>
    <div>
      <b>{{ gameState.attempts() }}</b> ATTEMPTS
    </div>
  </div>
  @if (logoutError()) {
    <p role="alert">{{ logoutError() }}</p>
  }
</header>
